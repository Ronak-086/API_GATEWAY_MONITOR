global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: "api-gateway"
          environment: "local"

  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
      